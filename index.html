<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IUSA - Sistema de Evaluaciones y Reportes de Transporte</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Cliente oficial de Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 450px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    /* Encabezado con Logo Oficial PNG */
    .header-container {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 14px;
    }

    .header-logo {
      flex-shrink: 0;
      width: 55px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .header-title {
      flex-grow: 1;
      text-align: left;
    }

    .header-title h2 {
      color: #0f172a;
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-title p {
      margin: 3px 0 0 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .info-box {
      background: #f0f9ff;
      border-left: 5px solid #0284c7;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .info-box p { margin: 5px 0; color: #0369a1; font-weight: 600; font-size: 14px; }
    
    label { font-weight: bold; display: block; margin-top: 15px; color: #334155; font-size: 14px; }
    select, textarea, input { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      box-sizing: border-box; 
      background: #ffffff; 
      font-size: 14px;
    }
    
    .star-rating { display: flex; gap: 8px; font-size: 32px; cursor: pointer; margin-top: 5px; justify-content: center; }
    .star { color: #cbd5e1; transition: color 0.2s; }
    .star.selected { color: #f59e0b; }
    
    .btn-scan { background: #0f766e; color: #fff; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 8px; font-weight: bold; }
    .btn-toggle-manual { background: transparent; color: #2563eb; border: none; padding: 6px; cursor: pointer; font-size: 13px; text-decoration: underline; width: 100%; text-align: center; margin-top: 6px; }
    .btn-submit { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 20px; font-weight: bold; font-size: 16px; }
    
    #reader { width: 100%; margin-top: 10px; border-radius: 8px; overflow: hidden; display: none; }
    .badge-scanned { background: #dcfce7; color: #15803d; padding: 10px; border-radius: 6px; margin-top: 8px; font-weight: bold; text-align: center; display: none; }
    .notice-pin { font-size: 12px; color: #0284c7; margin-top: 4px; font-weight: normal; }
  </style>
</head>
<body>

<div class="card">
  <!-- Encabezado con Imagen de Logo Oficial de IUSA -->
  <div class="header-container">
    <div class="header-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Logo_IUSA.svg/500px-Logo_IUSA.svg.png" alt="IUSA Logo">
    </div>
    <div class="header-title">
      <h2>Gestión de Transporte</h2>
      <p>IUSA Transportes</p>
    </div>
  </div>
  
  <div class="info-box" id="infoChofer">
    <p>Cargando información del transporte...</p>
  </div>

  <form id="formReporte">
    <label>1. Credencial del Colaborador:</label>
    
    <!-- Escáner -->
    <div id="bloqueEscaner">
      <button type="button" class="btn-scan" onclick="iniciarEscaner()">📷 Escanear Código de Barras</button>
      <button type="button" class="btn-toggle-manual" onclick="mostrarModoManual()">¿Credencial dañada? Capturar manualmente</button>
      <div id="reader"></div>
      <div id="badgeCredencial" class="badge-scanned">✓ Credencial: <span id="numCredencialTexto"></span></div>
    </div>

    <!-- Captura Manual -->
    <div id="bloqueManual" style="display: none;">
      <input type="text" id="inputManualCredencial" placeholder="Ej. 08001986" oninput="sincronizarManual(this.value)">
      <button type="button" class="btn-toggle-manual" onclick="mostrarModoEscaner()">Usar cámara para escanear</button>
    </div>

    <input type="hidden" id="credencialEmisor" required>

    <!-- PIN de Seguridad -->
    <label for="pinSeguridad">2. PIN de Seguridad (4 dígitos):</label>
    <input type="password" id="pinSeguridad" maxlength="4" placeholder="****" pattern="[0-9]{4}" inputmode="numeric" required>
    <div class="notice-pin">Si es tu primer uso, el PIN que ingreses se registrará automáticamente como tu clave personal.</div>

    <label for="tipoEnvio">3. Tipo de Registro:</label>
    <select id="tipoEnvio" onchange="cambiarTipo()">
      <option value="Calificación">Calificación (Estrellas)</option>
      <option value="Reporte de Falta">Reporte de Falta / Incidencia</option>
    </select>

    <!-- Calificación -->
    <div id="seccionCalificacion">
      <label>Puntuación:</label>
      <div class="star-rating">
        <span class="star" onclick="setRating(1)">★</span>
        <span class="star" onclick="setRating(2)">★</span>
        <span class="star" onclick="setRating(3)">★</span>
        <span class="star" onclick="setRating(4)">★</span>
        <span class="star" onclick="setRating(5)">★</span>
      </div>
      <p id="etiquetaPuntuacion" style="font-weight: bold; color: #f59e0b; text-align: center; margin-top: 5px;"></p>
    </div>

    <!-- Reporte de Falta -->
    <div id="seccionReporte" style="display: none;">
      <label for="comentario">Detalle de la Incidencia:</label>
      <textarea id="comentario" rows="4" placeholder="Escribe aquí los detalles del reporte..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Enviar Registro</button>
  </form>
</div>

<script>
  // CONFIGURACIÓN DE SUPABASE
  const SUPABASE_URL = "https://jjfcesrsexuxyamoghsx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_tkHpyaqmhlm8HuQvcVwzPg_Q0hehaPF  "; // <-- PEGA AQUÍ TU CLAVE 'Publishable key'
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const idCamion = urlParams.get('camion') || urlParams.get('id') || "123456";
  let nombreChoferFinal = urlParams.get('chofer') || "Cargando...";

  let ratingVal = 0;
  const etiquetas = ["", "1★ - Pésimo", "2★ - Malo", "3★ - Regular", "4★ - Bueno", "5★ - Excelente"];
  let html5QrcodeScanner;

  // Consulta dinámica en Supabase para obtener el Chofer
  async function cargarDatosCamion() {
    if (urlParams.get('chofer')) {
      nombreChoferFinal = urlParams.get('chofer');
      renderInfo();
      return;
    }

    const { data, error } = await _supabase
      .from('choferes_unidades')
      .select('*')
      .eq('id_camion', idCamion)
      .maybeSingle();

    if (data && data.nombre_chofer) {
      nombreChoferFinal = data.nombre_chofer;
    } else {
      nombreChoferFinal = "No asignado en base de datos";
    }
    renderInfo();
  }

  function renderInfo() {
    document.getElementById('infoChofer').innerHTML = `
      <p>Número de Camión: <strong>${idCamion}</strong></p>
      <p>Nombre del Chofer: <strong>${nombreChoferFinal}</strong></p>
      <p>Empresa: <strong>IUSA Transportes</strong></p>
    `;
  }

  cargarDatosCamion();

  function setRating(val) {
    ratingVal = val;
    const stars = document.querySelectorAll('.star');
    stars.forEach((s, idx) => {
      if(idx < val) s.classList.add('selected');
      else s.classList.remove('selected');
    });
    document.getElementById('etiquetaPuntuacion').innerText = etiquetas[val];
  }

  function cambiarTipo() {
    const tipo = document.getElementById('tipoEnvio').value;
    const secCal = document.getElementById('seccionCalificacion');
    const secRep = document.getElementById('seccionReporte');
    const txtComentario = document.getElementById('comentario');

    if (tipo === 'Calificación') {
      secCal.style.display = 'block';
      secRep.style.display = 'none';
      txtComentario.removeAttribute('required');
      txtComentario.value = "";
    } else {
      secCal.style.display = 'none';
      secRep.style.display = 'block';
      txtComentario.setAttribute('required', 'true');
      ratingVal = 0;
      setRating(0);
    }
  }

  function mostrarModoManual() {
    if(html5QrcodeScanner) { try { html5QrcodeScanner.stop(); } catch(e){} }
    document.getElementById('bloqueEscaner').style.display = 'none';
    document.getElementById('bloqueManual').style.display = 'block';
    document.getElementById('credencialEmisor').value = "";
  }

  function mostrarModoEscaner() {
    document.getElementById('bloqueManual').style.display = 'none';
    document.getElementById('bloqueEscaner').style.display = 'block';
    document.getElementById('credencialEmisor').value = "";
    document.getElementById('badgeCredencial').style.display = 'none';
  }

  function sincronizarManual(val) {
    document.getElementById('credencialEmisor').value = val.trim();
  }

  function iniciarEscaner() {
    document.getElementById('reader').style.display = 'block';
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 120 } },
      (decodedText) => {
        document.getElementById('credencialEmisor').value = decodedText;
        document.getElementById('numCredencialTexto').innerText = decodedText;
        document.getElementById('badgeCredencial').style.display = 'block';
        html5QrcodeScanner.stop();
        document.getElementById('reader').style.display = 'none';
      },
      () => {}
    );
  }

  // Lógica de Envío y Validación en Supabase
  document.getElementById('formReporte').addEventListener('submit', async function(e) {
    e.preventDefault();
    const credencialIngresada = document.getElementById('credencialEmisor').value.trim();
    const pinIngresado = document.getElementById('pinSeguridad').value.trim();

    if(!credencialIngresada) {
      alert("Por favor escanea o ingresa tu número de credencial.");
      return;
    }

    if(!pinIngresado || pinIngresado.length !== 4) {
      alert("Por favor ingresa tu PIN de seguridad de 4 dígitos.");
      return;
    }

    const numTexto = credencialIngresada;
    const numLimpio = parseInt(credencialIngresada, 10).toString();

    // 1. Consultar credencial en Supabase
    const { data: usuarios, error } = await _supabase
      .from('credenciales_validas')
      .select('*')
      .or(`numero_credencial.eq.${numTexto},numero_credencial.eq.${numLimpio}`);

    if (error) {
      alert("Error al conectar con el servidor: " + error.message);
      return;
    }

    const usuario = usuarios && usuarios.length > 0 ? usuarios[0] : null;

    if (!usuario) {
      alert("Credencial no registrada en el padrón activo de IUSA.");
      return;
    }

    if (usuario.estado.toLowerCase() !== 'activo') {
      alert("Esta credencial se encuentra Inactiva.");
      return;
    }

    // 2. PIN Auto-registro o Verificación
    if (!usuario.pin_seguridad) {
      const { error: updateError } = await _supabase
        .from('credenciales_validas')
        .update({ pin_seguridad: pinIngresado })
        .eq('id', usuario.id);

      if (updateError) {
        alert("Error al registrar el PIN inicial: " + updateError.message);
        return;
      }
      alert("¡PIN asignado correctamente como tu clave personal para futuros usos!");
    } else if (usuario.pin_seguridad !== pinIngresado) {
      alert("PIN de seguridad incorrecto.");
      return;
    }

    // Fecha y hora local limpia sin sufijos de zona horaria
    const ahora = new Date();
    const isoLocal = new Date(ahora.getTime() - (ahora.getTimezoneOffset() * 60000)).toISOString().replace('T', ' ').substring(0, 19);

    // 3. Guardar Reporte en Supabase
    const tipo = document.getElementById('tipoEnvio').value;
    const folio = "REP-" + Math.floor(100000 + Math.random() * 900000);

    const { error: insertError } = await _supabase
      .from('reportes_recibidos')
      .insert([
        {
          folio_reporte: folio,
          fecha_hora: isoLocal,
          id_chofer: idCamion,
          credencial_emisor: numTexto,
          tipo_envio: tipo,
          puntuacion: ratingVal ? ratingVal.toString() : "N/A",
          etiqueta: etiquetas[ratingVal] || "N/A",
          comentario: document.getElementById('comentario').value || "Sin detalle",
          estatus: 'Activo'
        }
      ]);

    if (insertError) {
      alert("Error al guardar el registro: " + insertError.message);
    } else {
      alert("¡Registro enviado exitosamente!\nFolio: " + folio + "\nUsuario: " + (usuario.nombre_usuario || numTexto));
      location.reload();
    }
  });
</script>

</body>
</html>
